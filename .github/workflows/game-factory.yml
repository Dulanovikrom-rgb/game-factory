name: Game Factory
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'create — новая игра; publish — одобрить файл и пост'
        type: choice
        options: [create, publish]
        default: create
      game_id:
        description: 'Только для publish: ID из Telegram'
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: game-factory
  cancel-in-progress: false
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      COMMAND: ${{ inputs.command }}
      GAME_ID: ${{ inputs.game_id }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare program
        run: |
          cat > /tmp/factory.py <<'PY'
          import os, json, re, time, secrets, pathlib, urllib.request, urllib.error, urllib.parse
          P = pathlib.Path
          COMMAND = os.environ.get('COMMAND', 'create')
          GAME_ID = os.environ.get('GAME_ID', '').strip()
          BASE = os.environ['SITE_URL'].rstrip('/')
          
          def secret(name):
              value = os.environ.get(name, '').strip()
              if not value:
                  raise RuntimeError('Missing GitHub Actions secret: ' + name)
              if not value.isascii() or any(c.isspace() for c in value):
                  raise RuntimeError('Secret ' + name + ' contains spaces or non-ASCII characters. Paste only the actual key/ID.')
              return value
          
          TOKEN = secret('BOT_TOKEN')
          OWNER = secret('OWNER_ID')
          if not re.fullmatch(r'\d+', OWNER):
              raise RuntimeError('OWNER_ID must be your numeric Telegram user ID, not a username.')
          
          def request_json(url, data, headers=None, timeout=180):
              req = urllib.request.Request(url, data=json.dumps(data).encode(), headers={'Content-Type': 'application/json', **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  # Do not print the URL, request headers, or body containing credentials.
                  raise RuntimeError('HTTP ' + str(error.code) + ' from ' + urllib.parse.urlparse(url).hostname) from None
          
          def tg(method, data):
              result = request_json('https://api.telegram.org/bot' + TOKEN + '/' + method, data, timeout=60)
              if not result.get('ok'):
                  raise RuntimeError('Telegram rejected operation: ' + method)
              return result['result']
          
          def send_file(path, caption):
              boundary = '----' + secrets.token_hex(16)
              body = b''
              for key, value in {'chat_id': OWNER, 'caption': caption}.items():
                  body += f'--{boundary}\r\nContent-Disposition: form-data; name="{key}"\r\n\r\n{value}\r\n'.encode()
              body += f'--{boundary}\r\nContent-Disposition: form-data; name="document"; filename="game.html"\r\nContent-Type: text/html\r\n\r\n'.encode()
              body += path.read_bytes() + f'\r\n--{boundary}--\r\n'.encode()
              req = urllib.request.Request('https://api.telegram.org/bot' + TOKEN + '/sendDocument', data=body, headers={'Content-Type': 'multipart/form-data; boundary=' + boundary})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('Telegram sendDocument failed: HTTP ' + str(error.code) + '. Check BOT_TOKEN, OWNER_ID, and press Start in the bot.') from None
              if not result.get('ok'):
                  raise RuntimeError('Telegram could not deliver the HTML file.')
          
          def metadata_path():
              if not re.fullmatch('[a-f0-9]{8}', GAME_ID):
                  raise RuntimeError('Enter the eight-character game ID from Telegram in game_id.')
              path = P('drafts') / (GAME_ID + '.json')
              if not path.exists():
                  raise RuntimeError('Game ID was not found in this repository.')
              return path
          
          def load_game():
              path = metadata_path()
              return path, json.loads(path.read_text())
          
          def write_meta(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2))
          
          P('drafts').mkdir(exist_ok=True)
          P('site/games').mkdir(parents=True, exist_ok=True)
          if not P('site/index.html').exists():
              P('site/index.html').write_text('<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Игры</title><h1>Игры</h1><p>Открывайте игры по ссылкам из Telegram.</p></html>')
          
          if COMMAND == 'create':
              key = secret('OPENROUTER_API_KEY')
              prompt = 'Create an original polished simple mobile HTML5 game, NOT a maze. Russian interface. Touch controls, clear instructions, restart, score, short rounds. One complete self-contained HTML, inline JS/CSS. No external resources, URLs, network requests, navigation, forms, storage, eval, payments. Keep HTML under 18000 characters. Return ONLY a JSON object with three string fields: title, description, html. No Markdown. Vary mechanics. Include html and head tags.'
              payload = {'model': 'openrouter/free', 'messages': [{'role': 'user', 'content': prompt}], 'max_tokens': 12000}
              obj = None
              last_error = 'unknown'
              for attempt in range(1, 4):
                  print('Generation attempt', attempt, 'of 3', flush=True)
                  try:
                      result = request_json('https://openrouter.ai/api/v1/chat/completions', payload, {'Authorization': 'Bearer ' + key}, timeout=150)
                      if result.get('error'):
                          err = result['error']
                          errcode = err.get('code', 'unknown') if isinstance(err, dict) else 'unknown'
                          raise ValueError('Provider returned an error; code=' + str(errcode))
                      choices = result.get('choices') or []
                      if not choices:
                          raise ValueError('No choices returned')
                      choice = choices[0]
                      reason = choice.get('finish_reason')
                      message = choice.get('message') or {}
                      content = message.get('content')
                      if not isinstance(content, str) or not content.strip():
                          raise ValueError('Empty model answer; finish_reason=' + str(reason))
                      if reason in ('length', 'error', 'content_filter'):
                          raise ValueError('Incomplete/refused answer; finish_reason=' + str(reason))
                      text = re.sub(r'^```(?:json)?\s*', '', content.strip())
                      text = re.sub(r'\s*```$', '', text)
                      candidate = json.loads(text)
                      if not isinstance(candidate, dict) or not all(isinstance(candidate.get(k), str) and candidate[k].strip() for k in ('title', 'description', 'html')):
                          raise ValueError('Expected JSON string fields: title, description, html')
                      html = candidate['html']
                      if len(html) > 180000 or '<html' not in html.lower() or '<script' not in html.lower():
                          raise ValueError('HTML missing or incomplete')
                      policy = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'\">"
                      html, count = re.subn(r'(<head[^>]*>)', lambda m: m[0] + policy, html, count=1, flags=re.I)
                      if count != 1:
                          raise ValueError('HTML head missing')
                      candidate['html'] = html
                      obj = candidate
                      break
                  except (ValueError, RuntimeError, TimeoutError, urllib.error.URLError) as error:
                      if isinstance(error, json.JSONDecodeError):
                          last_error = 'Model did not return valid JSON'
                      elif isinstance(error, (TimeoutError, urllib.error.URLError)):
                          last_error = 'Network timeout or connection failure'
                      else:
                          last_error = str(error)
                      print('Attempt unsuccessful:', last_error, flush=True)
                      if 'HTTP 401' in last_error or 'HTTP 403' in last_error or 'HTTP 402' in last_error:
                          break
                      if attempt < 3:
                          time.sleep(8)
              if obj is None:
                  raise RuntimeError('No valid game generated. ' + last_error + '. Check OpenRouter quota/key/account access. Nothing published.')
              ident = secrets.token_hex(4)
              path = P('drafts') / (ident + '.html')
              path.write_text(obj['html'])
              meta = {'title': obj['title'][:90], 'description': obj['description'][:450], 'status': 'draft'}
              write_meta(P('drafts') / (ident + '.json'), meta)
              send_file(path, 'Новая игра: ' + meta['title'] + '\n' + meta['description'] + '\nID: ' + ident + '\nКак поступим: публикуем или создаём другую? Проверьте HTML. Одобрение: GitHub Actions → Run workflow → publish + ID. Для другой игры: create. Проверена структура, но не играбельность.')
              print('Draft created:', ident, flush=True)
          elif COMMAND == 'publish':
              path, meta = load_game()
              if meta.get('status') not in ('draft', 'approved'):
                  raise RuntimeError('Already published or unavailable; check channel before retrying.')
              destination = P('site/games') / GAME_ID
              destination.mkdir(exist_ok=True)
              (destination / 'index.html').write_bytes((P('drafts') / (GAME_ID + '.html')).read_bytes())
              meta['status'] = 'approved'
              write_meta(path, meta)
          elif COMMAND == 'notify':
              path, meta = load_game()
              if meta.get('status') != 'approved':
                  raise RuntimeError('Publication was not approved.')
              url = BASE + '/games/' + GAME_ID + '/'
              expected = (P('drafts') / (GAME_ID + '.html')).read_bytes()
              confirmed = False
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          confirmed = response.read() == expected
                  except (urllib.error.URLError, TimeoutError):
                      pass
                  if confirmed:
                      break
                  time.sleep(10)
              if not confirmed:
                  raise RuntimeError('Pages file not confirmed. No post sent. Check Pages deployment.')
              channel = os.environ.get('CHANNEL_ID', '').strip() or OWNER
              tg('sendMessage', {'chat_id': channel, 'text': meta['title'] + '\n\n' + meta['description'] + '\n\nИграть: ' + url})
              meta['status'] = 'published'
              write_meta(path, meta)
          else:
              raise RuntimeError('Unknown command')
          PY
      - name: Generate or approve
        run: python /tmp/factory.py
      - name: Save game files
        run: |
          git config user.name game-factory
          git config user.email game-factory@users.noreply.github.com
          git add drafts site
          if ! git diff --cached --quiet; then
            git commit -m "Update game factory"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: inputs.command == 'publish'
      - uses: actions/upload-pages-artifact@v3
        if: inputs.command == 'publish'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
        if: inputs.command == 'publish'
      - name: Send approved publication
        if: inputs.command == 'publish'
        run: |
          COMMAND=notify python /tmp/factory.py
          git add drafts
          git commit -m "Record channel publication"
          git push
