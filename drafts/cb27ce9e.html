<!DOCTYPE html><html lang="ru"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'"><meta charset="UTF-8"><title>Поймай цель</title><style>body{margin:0;font-family:sans-serif;background:#f0f0f0;display:flex;flex-direction:column;align-items:center;height:100vh;}#game{position:relative;width:100%;max-width:400px;margin:20px;}#target{position:absolute;width:40px;height:40px;background:#ff5722;border-radius:50%;cursor:pointer;transition:transform .2s;}#score,#timer{margin:10px;font-size:1.2em;}#instructions{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;padding:10px;border-radius:5px;display:none;}#restart{margin-top:10px;padding:8px 16px;font-size:1em;cursor:pointer;}</style></head><body><div id="game"><div id="instructions">Нажмите на появляющуюся цель, чтобы набрать очки. Игра длится 30 секунд.</div><div id="score">Очки: 0</div><div id="timer">Время: 30</div><div id="target"></div></div><button id="restart" style="display:none;">Перезапустить</button><script>let score=0,timeLeft=30,targetInterval,timerInterval;const target=document.getElementById('target'),scoreEl=document.getElementById('score'),timerEl=document.getElementById('timer'),instructions=document.getElementById('instructions'),restartBtn=document.getElementById('restart');function randomPos(){const w=target.offsetWidth,h=target.offsetHeight,maxX=window.innerWidth-w,maxY=window.innerHeight-h;return{ x:Math.random()*maxX,y:Math.random()*maxY};}function moveTarget(){const pos=randomPos();target.style.transform=`translate(${pos.x}px, ${pos.y}px)`;}target.addEventListener('click',()=>{const rect=target.getBoundingClientRect();const dx=event.clientX-rect.left-20,dy=event.clientY-rect.top-20;if(Math.sqrt(dx*dx+dy*dy)<=20){score++;scoreEl.textContent=`Очки: ${score}`;moveTarget();}});document.addEventListener('touchstart',e=>{const touch=e.touches[0];const rect=target.getBoundingClientRect();const dx=touch.clientX-rect.left-20,dy=touch.clientY-rect.top-20;if(Math.sqrt(dx*dx+dy*dy)<=20){score++;scoreEl.textContent=`Очки: ${score}`;moveTarget();}});function startGame(){instructions.style.display='none';moveTarget();timerInterval=setInterval(()=>{timeLeft--;timerEl.textContent=`Время: ${timeLeft}`;if(timeLeft<=0){clearInterval(timerInterval);instructions.style.display='block';restartBtn.style.display='inline-block';}},1000);targetInterval=setInterval(moveTarget,1500);}restartBtn.addEventListener('click',()=>{resetGame();});function resetGame(){score=0;scoreEl.textContent=`Очки: ${score}`;timeLeft=30;timerEl.textContent=`Время: 30`;instructions.style.display='none';restartBtn.style.display='none';moveTarget();startGame();}startGame();</script></body></html>
